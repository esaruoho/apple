# report-card knobs for this repo. Read by print-card.py and gen-status.py.
title       = apple — Feature Reference
# file extensions to recognise as "innards" in a scenario's # cite: line
source_ext  = .asm,.inc,.py,.lua,.c,.h,.cpp,.ts,.js,.rb,.go,.rs,.swift,.sch
# card-name prefixes treated as meta/process cards (kept out of the main list)
meta_prefix = session-,day-
# cards excluded from STATUS.md (rollups, host-side tooling, …)
exclude     =
# column labels + a note for STATUS.md
runtime_label  = Runtime
hardware_label = Hardware
status_note    =
